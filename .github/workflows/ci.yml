name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.os }}
    # PHP 8.6 is pre-GA: its legs resolve dependencies whose locked versions
    # still cap at PHP 8.5, so those combinations are signal, not gates.
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the whitespace gate can compute merge bases and
          # resolve github.event.before on push events.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer files
        # The rector package's exact Rector pin is deliberate (see the README),
        # so its validation runs without --strict to tolerate the pin warning.
        run: |
          composer validate --strict
          composer --working-dir=packages/rector validate

      - name: Install locked dependencies
        if: matrix.laravel == '12'
        run: composer install --no-interaction --no-progress

      - name: Resolve Laravel 13 on the current PHP runtime
        if: matrix.laravel == '13'
        # Bash preserves the caret constraint on Windows too; PowerShell's
        # composer.bat invocation can strip it and select exactly 13.0.0.
        shell: bash
        run: |
          set -euo pipefail
          composer config --unset platform.php
          composer require 'laravel/framework:^13.0' --with-all-dependencies --no-interaction --no-progress --prefer-dist
          # Source-contract tests inspect the committed manifests. Restore only
          # those files, retaining the resolved Laravel 13 vendor installation.
          git restore --source=HEAD --worktree -- composer.json composer.lock

      - name: Verify the installed framework and platform
        shell: bash
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; $version = Illuminate\Foundation\Application::VERSION; printf("Testing Laravel %s on PHP %s\n", $version, PHP_VERSION); if (explode(".", $version)[0] !== getenv("LARAVEL_MAJOR")) { throw new RuntimeException("Installed framework does not match the CI matrix"); }'
          composer check-platform-reqs

      - name: Check for whitespace errors
        # A clean checkout has no worktree delta, so a bare `git diff --check`
        # is a no-op. Check the changed lines of the triggering range instead:
        # - pull_request: merge-base(origin/<base branch>, HEAD) .. HEAD, i.e.
        #   exactly the lines the PR adds on top of its merge base.
        # - push: github.event.before .. github.sha, i.e. the pushed commits.
        #   If the previous SHA is unavailable (branch created, or its history
        #   force-pushed away), fall back to the empty tree, which checks the
        #   whole pushed tree.
        # There are no path exemptions: test fixtures are written without
        # literal trailing whitespace, so every changed line is checked.
        # Requires full checkout history (fetch-depth: 0 above). The script
        # runs under Git Bash on both Linux and Windows.
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$PR_BASE_REF" HEAD)"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "Checking whitespace errors in $base..HEAD"
          git diff --check "$base" HEAD

      - name: Run the test suite (includes the migration end-to-end gate)
        run: composer test
