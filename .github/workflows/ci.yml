name: CI

on:
  push:
    branches: [main]
  pull_request:

# One self-hosted runner serves the whole matrix: cancel superseded runs for
# the same ref instead of queueing stale legs behind the newest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel 13
    runs-on: self-hosted
    # PHP 8.6 is pre-GA: its legs install a lock whose dependencies still cap
    # at PHP 8.5, so those combinations are signal, not gates.
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the whitespace gate can compute merge bases and
          # resolve github.event.before on push events.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer files
        # The rector package's exact Rector pin is deliberate (see the README),
        # so its validation runs without --strict to tolerate the pin warning.
        run: |
          composer validate --strict
          composer --working-dir=packages/rector validate

      - name: Install locked dependencies
        # The committed lock already resolves Laravel 13 at the PHP 8.3
        # platform, so every leg installs it verbatim; only the actual runtime
        # differs between legs.
        run: composer install --no-interaction --no-progress

      - name: Verify the installed framework and platform
        shell: bash
        env:
          LARAVEL_MAJOR: '13'
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; $version = Illuminate\Foundation\Application::VERSION; printf("Testing Laravel %s on PHP %s\n", $version, PHP_VERSION); if (explode(".", $version)[0] !== getenv("LARAVEL_MAJOR")) { throw new RuntimeException("Installed framework does not match the CI matrix"); }'
          composer check-platform-reqs

      - name: Check for whitespace errors
        # A clean checkout has no worktree delta, so a bare `git diff --check`
        # is a no-op. Check the changed lines of the triggering range instead:
        # - pull_request: merge-base(origin/<base branch>, HEAD) .. HEAD, i.e.
        #   exactly the lines the PR adds on top of its merge base.
        # - push: github.event.before .. github.sha, i.e. the pushed commits.
        #   If the previous SHA is unavailable (branch created, or its history
        #   force-pushed away), fall back to the empty tree, which checks the
        #   whole pushed tree.
        # There are no path exemptions: test fixtures are written without
        # literal trailing whitespace, so every changed line is checked.
        # Requires full checkout history (fetch-depth: 0 above). The script
        # runs under Git Bash on both Linux and Windows.
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/$PR_BASE_REF" HEAD)"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "Checking whitespace errors in $base..HEAD"
          git diff --check "$base" HEAD

      - name: Run the test suite (includes the migration end-to-end gate)
        run: composer test
